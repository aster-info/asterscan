<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f6f9">

  <title>Monitoring Entrées & Liste des Inscrits - ASTER</title>
  
  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }

    .logo-container {
      margin: 10px auto 15px auto;
      max-width: 180px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #333;
      margin: 10px 0 15px 0;
      font-size: 1.4em;
    }

    .section-title {
      max-width: 420px;
      margin: 0 auto 10px auto;
      font-size: 1.1em;
      color: #444;
      text-align: center;
      font-weight: bold;
    }

    .history-container, .members-container-card {
      text-align: left;
      max-width: 420px;
      width: 100%;
      margin: 0 auto 20px auto;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .history-item, .member-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:last-child, .member-item:last-child {
      border-bottom: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-thumb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ddd;
      background-color: #eee;
      flex-shrink: 0;
    }

    .badge-count {
      background-color: #00b894;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
      margin-left: 6px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9em;
      margin-bottom: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: #00b894;
    }

    .members-scroll-list {
      max-height: 250px;
      overflow-y: auto;
    }

    .empty-msg {
      color: #aaa;
      text-align: center;
      margin: 10px 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo ASTER" id="app-logo">
  </div>

  <h2>Monitoring Entrées & Sorties</h2>

  <!-- Historique des récents passages -->
  <div class="section-title">Derniers passages</div>
  <div class="history-container" id="history-list">
    <p class="empty-msg">Aucun historique récent</p>
  </div>

  <!-- Section Liste des Inscrits -->
  <div class="section-title">
    Liste des Inscrits <span class="badge-count" id="totalCount">0</span>
  </div>
  <div class="members-container-card">
    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un membre par nom ou ID..." oninput="filtrerMembres()">
    <div class="members-scroll-list" id="membersList">
      <p class="empty-msg">Chargement des membres...</p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr2945zVbehDI2yAH2YgSsHA2BOCM8r3whjyL2zFYuMOrJjhIm7e_9NWNkc0QARwQ/exec";
    let lastScanKey = null;
    let tousLesMembres = [];

    function nettoyerHeure(heureBrute) {
      if (!heureBrute) return "--:--:--";
      const strHeure = String(heureBrute).trim();
      if (strHeure.indexOf("T") !== -1) {
        const parts = strHeure.split("T")[1];
        return parts ? parts.substring(0, 8) : strHeure;
      }
      return strHeure.substring(0, 8);
    }

    // --- CHARGEMENT DU MONITORING DE SCAN ---
    async function checkNewScans() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getLastScan`);
        const data = await response.json();

        if (data.success && data.scan) {
          const currentScanKey = String(data.scan.id) + "_" + String(data.scan.heure) + "_" + String(data.scan.statut);
          if (currentScanKey !== lastScanKey) {
            lastScanKey = currentScanKey;
            updateDashboard(data.history);
          }
        }
      } catch (error) {
        console.error("Erreur de connexion au monitoring :", error);
      }
    }

    function updateDashboard(history) {
      const historyContainer = document.getElementById("history-list");
      if (history && history.length > 0) {
        historyContainer.innerHTML = history.map(item => {
          const thumbSrc = (item.photoUrl && String(item.photoUrl).trim().length > 5) 
            ? item.photoUrl 
            : 'https://via.placeholder.com/36?text=?';

          const isEntree = (item.statut === "Entrée");
          const colorTime = isEntree ? "#00b894" : "#d63031";

          return `
            <div class="history-item">
              <div class="user-info">
                <img class="mini-thumb" src="${thumbSrc}" alt="Avatar">
                <span>
                  <strong>${item.nom || 'Inconnu'}</strong> 
                  <small style="color:#666;">(${item.id || ''})</small>
                </span>
              </div>
              <span style="color:${colorTime}; font-weight:bold; margin-left: 10px;">${nettoyerHeure(item.heure)}</span>
            </div>
          `;
        }).join('');
      } else {
        historyContainer.innerHTML = '<p class="empty-msg">Aucun historique récent</p>';
      }
    }

    // --- CHARGEMENT SÉCURISÉ DE LA LISTE DES INSCRITS (JSONP) ---
    function chargerMembresJSONP() {
      const callbackName = "handleMembersResponse_" + Math.floor(Math.random() * 100000);
      
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (scriptTag && scriptTag.parentNode) {
          scriptTag.parentNode.removeChild(scriptTag);
        }

        if (data && data.success && data.members) {
          tousLesMembres = data.members;
          document.getElementById("totalCount").innerText = data.total;
          afficherMembres(tousLesMembres);
        } else {
          document.getElementById("membersList").innerHTML = `<p class="empty-msg" style="color:red;">Erreur: ${data.error || 'Aucun membre trouvé'}</p>`;
        }
      };

      const scriptTag = document.createElement("script");
      scriptTag.src = `${SCRIPT_URL}?action=getMembers&callback=${callbackName}`;
      scriptTag.onerror = function() {
        document.getElementById("membersList").innerHTML = '<p class="empty-msg" style="color:red;">Échec du chargement des inscrits.</p>';
      };
      document.body.appendChild(scriptTag);
    }

    function afficherMembres(liste) {
      const container = document.getElementById("membersList");
      if (liste.length === 0) {
        container.innerHTML = '<p class="empty-msg">Aucun résultat trouvé.</p>';
        return;
      }

      container.innerHTML = liste.map(m => {
        const photo = (m.photoUrl && m.photoUrl.length > 5) ? m.photoUrl : 'https://via.placeholder.com/36?text=?';
        return `
          <div class="member-item">
            <div class="user-info">
              <img class="mini-thumb" src="${photo}" alt="Avatar">
              <div>
                <strong style="color:#333; font-size:0.95em;">${m.nom}</strong>
                <div style="color:#777; font-size:0.8em;">${m.id}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrerMembres() {
      const recherche = document.getElementById("searchInput").value.toLowerCase();
      const resultats = tousLesMembres.filter(m => 
        m.nom.toLowerCase().includes(recherche) || m.id.toLowerCase().includes(recherche)
      );
      afficherMembres(resultats);
    }

    // --- INITIALISATION ---
    setInterval(checkNewScans, 2500);
    checkNewScans();
    chargerMembresJSONP();
  </script>
</body>
</html>
