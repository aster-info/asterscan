<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Entrées & Sorties - ASTER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 15px;
      text-align: center;
    }

    .logo-container {
      margin: 10px auto 15px auto;
      width: 110px;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    h2 {
      font-size: 1.25em;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .columns-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .columns-container {
        flex-direction: row;
      }
    }

    .column {
      flex: 1;
      background: #ffffff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      text-align: left;
    }

    .column-title {
      font-weight: bold;
      font-size: 0.95em;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 2px solid #eee;
      text-align: center;
    }

    .column-title.in {
      color: #00b894;
      border-bottom-color: #00b894;
    }

    .column-title.out {
      color: #d63031;
      border-bottom-color: #d63031;
    }

    .history-item {
      border-bottom: 1px solid #f0f0f0;
      padding: 8px 0;
      font-size: 0.85em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .mini-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ddd;
      background-color: #eee;
      flex-shrink: 0;
    }

    .user-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #333;
    }

    .time-badge {
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.8em;
      flex-shrink: 0;
    }

    .time-badge.entree {
      color: #00b894;
      background-color: #e6f9f5;
    }

    .time-badge.sortie {
      color: #d63031;
      background-color: #ffecec;
    }

    .empty-msg {
      color: #aaa;
      text-align: center;
      margin: 10px 0;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="logo.png" alt="Logo ASTER">
  </div>

  <h2>Monitoring Entrées & Sorties</h2>

  <div class="columns-container">
    <div class="column">
      <div class="column-title in">ENTRÉES (IN)</div>
      <div id="history-in">
        <p class="empty-msg">Aucune entrée</p>
      </div>
    </div>

    <div class="column">
      <div class="column-title out">SORTIES (OUT)</div>
      <div id="history-out">
        <p class="empty-msg">Aucune sortie</p>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr2945zVbehDI2yAH2YgSsHA2BOCM8r3whjyL2zFYuMOrJjhIm7e_9NWNkc0QARwQ/exec";
    let lastScanKey = null;

    function nettoyerHeure(heureBrute) {
      if (!heureBrute) return "--:--:--";
      const str = String(heureBrute).trim();
      if (str.includes("T")) {
        const parts = str.split("T")[1];
        return parts ? parts.substring(0, 8) : str;
      }
      return str.substring(0, 8);
    }

    function checkNewScansJSONP() {
      const callbackName = "handleLastScan_" + Math.floor(Math.random() * 100000);

      window[callbackName] = function(data) {
        delete window[callbackName];
        const script = document.getElementById(callbackName);
        if (script) script.remove();

        if (data && data.success && data.history) {
          updateDashboard(data.history);
        }
      };

      const scriptTag = document.createElement("script");
      scriptTag.id = callbackName;
      scriptTag.src = `${SCRIPT_URL}?action=getLastScan&callback=${callbackName}`;
      
      scriptTag.onerror = function() {
        delete window[callbackName];
        scriptTag.remove();
      };

      document.body.appendChild(scriptTag);
    }

    function createHistoryRow(item, isEntree) {
      const thumbSrc = (item.photoUrl && String(item.photoUrl).trim().length > 5) 
        ? item.photoUrl 
        : 'https://via.placeholder.com/32?text=?';

      const badgeClass = isEntree ? "entree" : "sortie";

      return `
        <div class="history-item">
          <div class="history-user-info">
            <img class="mini-thumb" src="${thumbSrc}" alt="Avatar">
            <span class="user-name" title="${item.nom || ''}">${item.nom || 'Inconnu'}</span>
          </div>
          <span class="time-badge ${badgeClass}">${nettoyerHeure(item.heure)}</span>
        </div>
      `;
    }
