<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statut des Membres - ASTER</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9em; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #eee; }
    th { background-color: #f8f9fa; color: #2c3e50; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .mini-thumb { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #eee; }
    .badge { font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 0.85em; display: inline-block; }
    .badge.present { color: #00b894; background-color: #e6f9f5; }
    .badge.sorti { color: #d63031; background-color: #ffecec; }
    .badge.attente { color: #b2bec3; background-color: #f1f2f6; }
    .loading, .error { text-align: center; padding: 20px; color: #666; }
    .error { color: #d63031; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Statut Actuel des Membres</h2>
    <div id="content-area"><div class="loading">Chargement...</div></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr2945zVbehDI2yAH2YgSsHA2BOCM8r3whjyL2zFYuMOrJjhIm7e_9NWNkc0QARwQ/exec";

    function fetchMembers() {
      const callbackName = "cb_" + Math.floor(Math.random() * 100000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.getElementById(callbackName)?.remove();
        if (data && data.success) {
          display(data.members);
        } else {
          showError("Erreur de récupération.");
        }
      };

      const script = document.createElement("script");
      script.id = callbackName;
      script.src = `${SCRIPT_URL}?action=getMembers&callback=${callbackName}`;
      script.onerror = () => showError("Erreur de connexion au script.");
      document.body.appendChild(script);
    }

    function display(members) {
      const container = document.getElementById("content-area");
      if (!members.length) {
        container.innerHTML = '<div class="loading">Aucun membre.</div>';
        return;
      }

      let html = `<table><thead><tr><th>Membre</th><th>Statut</th></tr></thead><tbody>`;
      members.forEach(m => {
        const thumb = (m.photoUrl && m.photoUrl.trim() > 5) ? m.photoUrl : 'https://via.placeholder.com/36?text=?';
        let bClass = "attente";
        if (m.statut === "Présent") bClass = "present";
        if (m.statut === "Sorti") bClass = "sorti";

        html += `<tr>
          <td><div class="user-info"><img class="mini-thumb" src="${thumb}"><span>${m.nom}</span></div></td>
          <td><span class="badge ${bClass}">${m.statut}</span></td>
        </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function showError(msg) {
      document.getElementById("content-area").innerHTML = `<div class="error">${msg}</div>`;
    }

    setInterval(fetchMembers, 5000);
    fetchMembers();
  </script>
</body>
</html>
