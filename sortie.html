<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - Sortie</title>
    <!-- Inclusion de la bibliothèque html5-qrcode pour la lecture de QR codes par la caméra -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 8px; overflow: hidden; }
        .status-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 16px; display: inline-block; width: 80%; max-width: 400px; }
        .success-bg { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error-bg { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h1>Scan de Sortie</h1>
    
    <!-- ============================================================================== -->
    <!-- [BLOC HTML] : Zone de la caméra pour le scan du QR Code -->
    <!-- ============================================================================== -->
    <div id="reader"></div>

    <!-- ============================================================================== -->
    <!-- [BLOC HTML] : Boîte de message / modale pour afficher le résultat du scan -->
    <!-- ============================================================================== -->
    <div id="result" class="status-box" style="display: none;"></div>

    <script>
        /**
         * ==============================================================================
         * [BLOC JS] : Fonction de traitement du succès du scan QR Code
         * Appelée automatiquement dès qu'un code est détecté par la caméra.
         * ==============================================================================
         */
        function onScanSuccess(decodedText, decodedResult) {
            // Arrêt temporaire du scan pour éviter les lectures multiples en rafale
            html5QrcodeScanner.clear().then(_ => {
                console.log("Scanner arrêté suite au scan de : " + decodedText);
                envoyerScanAuServeur(decodedText);
            }).catch(error => {
                console.error("Erreur lors de l'arrêt du scanner : ", error);
                envoyerScanAuServeur(decodedText);
            });
        }

        /**
         * ==============================================================================
         * [BLOC JS] : Envoi des données du code scanné vers le script Google Apps Script
         * Effectue une requête fetch vers l'API avec l'action "sortie".
         * ==============================================================================
         */
        function envoyerScanAuServeur(codeMembre) {
            // URL de ton Web App Google Apps Script (à remplacer par ton URL exacte si besoin)
            const urlAppScript = "TON_URL_GOOGLE_APPS_SCRIPT_ICI?action=sortie&code=" + encodeURIComponent(codeMembre);

            fetch(urlAppScript)
                .then(response => response.json())
                .then(data => {
                    afficherResultatModale(data, codeMembre);
                })
                .catch(error => {
                    console.error('Erreur réseau :', error);
                    afficherErreurReseau();
                });
        }

        /**
         * ==============================================================================
         * [BLOC JS] : Affichage dynamique du résultat dans la boîte modale/status
         * Intègre le Nom, l'ID, le Titre récupéré et l'état de sortie.
         * ==============================================================================
         */
        function afficherResultatModale(data, memberId) {
            const resultBox = document.getElementById('result');
            resultBox.style.display = "inline-block";

            // Vérification du statut renvoyé par le script (succès, déjà sorti, ou enquête requise)
            if (data.status === "ok" || data.status === "success") {
                resultBox.className = "status-box success-bg";
                resultBox.innerHTML = `
                    ✓ SORTIE VALIDÉE<br><br>
                    <span style="font-size: 18px; font-weight: bold;">${data.name || "Inconnu"}</span><br>
                    <span style="font-size: 13px; opacity: 0.85;">ID : ${memberId}</span><br>
                    <span style="font-size: 13px; font-style: italic; opacity: 0.9;">${data.titre || ""}</span><br><br>
                    <span style="font-size: 12px;">Départ : ${data.depart}</span>
                `;
            } else if (data.status === "enquete_requise") {
                // Bloc spécifique si l'enquête de satisfaction n'est pas remplie
                resultBox.className = "status-box error-bg";
                resultBox.innerHTML = `
                    ⚠ ENQUÊTE REQUISE<br><br>
                    <span style="font-size: 16px; font-weight: bold;">${data.name || "Inconnu"}</span><br>
                    <span style="font-size: 13px; font-style: italic;">${data.titre || ""}</span><br><br>
                    ${data.message}
                `;
            } else {
                // Cas d'erreur standard ou déjà sorti
                resultBox.className = "status-box error-bg";
                resultBox.innerHTML = `
                    ⚠ ATTENTION<br><br>
                    <span style="font-size: 16px; font-weight: bold;">${data.name || "Inconnu"}</span><br>
                    <span style="font-size: 13px; font-style: italic;">${data.titre || ""}</span><br><br>
                    ${data.message}
                `;
            }

            // Relancer le scanner automatiquement après quelques secondes pour le membre suivant
            setTimeout(() => {
                resultBox.style.display = "none";
                relancerScanner();
            }, 6000); // Laisse affiché pendant 6 secondes pour laisser le temps de lire ou cliquer sur l'enquête
        }

        /**
         * ==============================================================================
         * [BLOC JS] : Gestion des erreurs réseau
         * ==============================================================================
         */
        function afficherErreurReseau() {
            const resultBox = document.getElementById('result');
            resultBox.style.display = "inline-block";
            resultBox.className = "status-box error-bg";
            resultBox.innerText = "Erreur de connexion avec le serveur.";
            
            setTimeout(() => {
                resultBox.style.display = "none";
                relancerScanner();
            }, 4000);
        }

        /**
         * ==============================================================================
         * [BLOC JS] : Initialisation et réinitialisation du lecteur de QR Code
         * ==============================================================================
         */
        let html5QrcodeScanner;

        function relancerScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }, false);
            html5QrcodeScanner.render(onScanSuccess, (error) => {
                // Erreurs de scan en direct ignorées (normales tant qu'aucun QR code n'est dans le champ)
            });
        }

        // Démarrage initial de la caméra au chargement de la page
        document.addEventListener('DOMContentLoaded', (event) => {
            relancerScanner();
        });
    </script>
</body>
</html>
