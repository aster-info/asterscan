<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle de Sortie - ASTER</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; /* Fond général propre identique à l'entrée */
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }
        h3 {
            font-size: 22px;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            border-radius: 10px;
            overflow: hidden;
        }
        p {
            font-size: 14px;
            color: #666;
        }
        /* Style pour l'affichage des résultats après scan */
        .card-result {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            margin: 20px auto;
            text-align: center;
            display: none;
        }
        .status {
            font-weight: 500;
            padding: 18px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.5;
        }
        .success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .warning {
            background-color: #f97316;
            color: white;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
        }
        .btn-survey {
            background-color: #16a34a;
        }
        .btn-reset {
            background-color: #3b82f6;
        }
    </style>
</head>
<body>

    <!-- Écran principal du Scanner (sans boîte blanche) -->
    <div id="scanner-screen">
        <img src="logo.png" alt="Logo ASTER" class="logo">
        <h3>Contrôle des Sorties</h3>
        <div id="reader"></div>
        <p>Scannez le badge du membre pour valider la sortie</p>
    </div>

    <!-- Écran de Résultat (s'affiche uniquement après le scan) -->
    <div id="result-screen" class="card-result">
        <div id="message" class="status"></div>
        <div id="action-area">
            <button id="action-btn" class="btn">Action</button>
        </div>
    </div>

    <script>
        let html5QrCode;
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxr2945zVbehDI2yAH2YgSsHA2BOCM8r3whjyL2zFYuMOrJjhIm7e_9NWNkc0QARwQ/exec";

        function demarrerCamera() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                surScanReussi
            ).catch(err => {
                console.error("Erreur caméra : " + err);
                alert("Erreur caméra : impossible d'accéder à la caméra.");
            });
        }

        function surScanReussi(decodedText) {
            html5QrCode.stop().then(() => {
                let memberId = decodedText;
                try {
                    if (decodedText.includes('?')) {
                        const urlObj = new URL(decodedText);
                        memberId = urlObj.searchParams.get('id') || urlObj.searchParams.get('code') || decodedText;
                    }
                } catch (e) {}

                // Bascule l'affichage vers l'écran de résultat
                document.getElementById('scanner-screen').style.display = 'none';
                const resultScreen = document.getElementById('result-screen');
                resultScreen.style.display = 'block';

                const messageDiv = document.getElementById('message');
                messageDiv.className = 'status';
                messageDiv.style.background = '#f3f4f6';
                messageDiv.style.color = '#6b7280';
                messageDiv.innerHTML = "Vérification de la sortie en cours...";

                // Appel Google Apps Script
                fetch(`${scriptUrl}?code=${encodeURIComponent(memberId)}&action=sortie`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "ok") {
                            afficherMessage(`Au revoir ${data.name} ! Votre sortie a été enregistrée.`, "success");
                            afficherBouton("Scanner un autre badge", "btn-reset", () => location.reload());
                        } else if (data.status === "enquete_requise") {
                            afficherMessage(`📄 <strong>ENQUÊTE REQUISE</strong><br>${data.name} : Veuillez remplir l'enquête de satisfaction avant de sortir.<br><small>ID : ${memberId}</small>`, "warning");
                            afficherBouton("Remplir l'enquête", "btn-survey", () => {
                                window.open(data.url, '_blank');
                            });
                        } else if (data.status === "sortie_impossible") {
                            afficherMessage(`Attention ${data.name}, votre sortie est impossible (vous n'êtes pas marqué comme présent).`, "error");
                            afficherBouton("Scanner un autre", "btn-reset", () => location.reload());
                        } else {
                            afficherMessage("Erreur : " + (data.error || "Membre inconnu ou introuvable."), "error");
                            afficherBouton("Réessayer", "btn-reset", () => location.reload());
                        }
                    })
                    .catch(error => {
                        afficherMessage("Erreur de connexion au serveur de pointage.", "error");
                        afficherBouton("Réessayer", "btn-reset", () => location.reload());
                        console.error('Erreur:', error);
                    });
            }).catch(err => console.error(err));
        }

        function afficherMessage(texte, style) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = texte;
            messageDiv.className = `status ${style}`;
        }

        function afficherBouton(texte, classe, callback) {
            const actionBtn = document.getElementById('action-btn');
            actionBtn.innerText = texte;
            actionBtn.className = `btn ${classe}`;
            actionBtn.onclick = callback;
        }

        window.onload = demarrerCamera;
    </script>
</body>
</html>
