<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            max-width: 130px;
            height: auto;
            margin-bottom: 15px;
        }
        h3 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
        }
        .status-box {
            padding: 25px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: white;
            font-weight: 500;
            font-size: 16px;
            line-height: 1.5;
            display: none;
        }
        .success-bg {
            background-color: #1199aa;
        }
        .error-bg {
            background-color: #ef4444; 
        }
        .warning-bg {
            background-color: #f97316; 
            color: white;
        }
        .loading-bg {
            background-color: #6b7280; 
        }
        #member-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #10b981;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            margin-top: 5px;
            margin-right: 5px;
        }
        .btn-blue {
            background-color: #007bff;
        }
        .btn-blue:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.png" alt="Logo ASTER" class="logo">
        <h3 id="page-title">Contrôle des Sorties</h3>

        <!-- ============================================================================== -->
        <!-- [BLOC HTML] : Étape 1 - Le Scanner Caméra -->
        <!-- Contient la zone vidéo du lecteur QR code et le texte d'aide associé. -->
        <!-- ============================================================================== -->
        <div id="scanner-container">
            <div id="reader"></div>
            <p style="font-size: 14px; color: #666;">Scannez le badge du membre pour valider la sortie</p>
        </div>

        <!-- ============================================================================== -->
        <!-- [BLOC HTML] : Étape 2 - Le Grand Bloc de Résultat -->
        <!-- Affiche la photo du membre, la boîte de statut dynamique et la zone d'actions. -->
        <!-- ============================================================================== -->
        <div id="result-container" style="display: none;">
            <img id="member-photo" src="" alt="Photo du membre">
            <div id="message-box" class="status-box"></div>
            <div id="action-area"></div>
        </div>
    </div>

    <script>
        let html5QrCode;
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwUweBhU2D-B9nFFOYF5hWe0m48oCHhGZXVK1-sqyYllMLdwGnrDzjAXi9hbY0mWotq/exec";
        
        const urlParamsGlobal = new URLSearchParams(window.location.search);
        let actionParam = urlParamsGlobal.get('action');

        if (window.location.pathname.includes('sortie') || !actionParam) {
            actionParam = 'sortie';
        }

        /**
         * ==============================================================================
         * [BLOC JS] : Fonction de vérification de l'ID scanné auprès du serveur Google Apps Script
         * Gère l'affichage du chargement, l'appel fetch, l'affichage de la photo du membre,
         * et l'injection du nom, de l'ID et du titre dans les différents cas (succès, enquête, erreur).
         * ==============================================================================
         */
        function verifierID(memberId) {
            // [BLOC ISOLÉ] : Masquage du conteneur scanner et affichage du conteneur de résultat
            document.getElementById('scanner-container').style.display = 'none';
            const resultContainer = document.getElementById('result-container');
            resultContainer.style.display = 'block';
            
            const imgElem = document.getElementById('member-photo');
            imgElem.style.display = 'none';

            // [BLOC ISOLÉ] : État de chargement initial dans la boîte de message
            const msgBox = document.getElementById('message-box');
            msgBox.className = "status-box loading-bg";
            msgBox.style.display = "block";
            msgBox.innerHTML = "Vérification en cours...";

            // Requête vers l'API Google Apps Script
            fetch(`${scriptUrl}?code=${encodeURIComponent(memberId)}&action=${actionParam}`)
                .then(response => response.json())
                .then(data => {
                    const actionArea = document.getElementById('action-area');
                    actionArea.innerHTML = '';

                    // [BLOC ISOLÉ] : Gestion de l'affichage de la photo du membre si elle existe
                    if (data.photo && data.photo.trim() !== "") {
                        imgElem.src = data.photo;
                        imgElem.style.display = 'inline-block';
                    } else {
                        imgElem.style.display = 'none';
                    }

                    // [BLOC ISOLÉ] : Traitement du cas où la sortie est validée avec succès
                    if (data.status === "ok" || data.status === "success") {
                        msgBox.className = "status-box success-bg";
                        // [INTÉGRATION] : Ajout du Nom, de l'ID et du Titre (colonne B) sous le message de succès
                        msgBox.innerHTML = `✓ SORTIE VALIDÉE<br><span style="font-size: 18px; font-weight: bold;">${data.name || data.nom}</span><br><span style="font-size: 13px; opacity: 0.85;">ID : ${memberId}</span><br><span style="font-size: 13px; font-style: italic; opacity: 0.9;">${data.titre || ""}</span>`;
                        
                        const btn = document.createElement('button');
                        btn.className = "btn btn-blue";
                        btn.innerText = "Scanner un autre";
                        btn.onclick = () => location.href = "sortie.html";
                        actionArea.appendChild(btn);

                    // [BLOC ISOLÉ] : Traitement du cas où l'enquête de satisfaction est requise avant la sortie
                    } else if (data.status === "enquete_requise") {
                        msgBox.className = "status-box warning-bg";
                        // [INTÉGRATION] : Ajout du Nom, de l'ID et du Titre (colonne B) pour le bloc d'enquête requise
                        msgBox.innerHTML = `⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.<br><span style="font-size: 18px; font-weight: bold;">${data.name || ""}</span><br><span style="font-size: 13px; opacity: 0.85;">ID : ${memberId}</span><br><span style="font-size: 13px; font-style: italic; opacity: 0.9;">${data.titre || ""}</span>`;

                        if (data.redirectUrl) {
                            const btnEnquete = document.createElement('a');
                            btnEnquete.className = "btn btn-blue";
                            btnEnquete.innerText = "Remplir l'enquête";
                            btnEnquete.href = data.redirectUrl;
                            btnEnquete.target = "_blank";
                            actionArea.appendChild(btnEnquete);
                        }

                        const btnScan = document.createElement('button');
                        btnScan.className = "btn btn-blue";
                        btnScan.style.backgroundColor = "#6c757d"; 
                        btnScan.innerText = "Scanner un autre";
                        btnScan.onclick = () => location.href = "sortie.html";
                        actionArea.appendChild(btnScan);

                    // [BLOC ISOLÉ] : Traitement des autres cas (déjà sorti, non présent, etc.)
                    } else {
                        msgBox.className = "status-box warning-bg";
                        // [INTÉGRATION] : Affichage sécurisé incluant également le titre si disponible dans la réponse
                        let titreHtml = data.titre ? `<br><span style="font-size: 13px; font-style: italic; opacity: 0.9;">${data.titre}</span>` : "";
                        msgBox.innerHTML = `⚠️ ${data.message || "Erreur lors du contrôle."}${titreHtml}`;
                        
                        const btn = document.createElement('button');
                        btn.className = "btn btn-blue";
                        btn.innerText = "Scanner un autre";
                        btn.onclick = () => location.href = "sortie.html";
                        actionArea.appendChild(btn).focus();
                    }
                })
                .catch(error => {
                    // [BLOC ISOLÉ] : Gestion des erreurs de connexion au serveur
                    msgBox.className = "status-box error-bg";
                    msgBox.innerHTML = "❌ Erreur de connexion au serveur.";
                    const btn = document.createElement('button');
                    btn.className = "btn btn-blue";
                    btn.innerText = "Réessayer";
                    btn.onclick = () => location.href = "sortie.html";
                    actionArea.appendChild(btn);
                    console.error('Erreur:', error);
                });
        }

        /**
         * ==============================================================================
         * [BLOC JS] : Initialisation de la page au chargement (window.onload)
         * Vérifie si un paramètre d'URL est présent ou démarre le scanner de la caméra.
         * ==============================================================================
         */
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id') || urlParams.get('code');

            if (memberId) {
                verifierID(memberId.trim());
            } else {
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    (decodedText) => {
                        html5QrCode.stop().then(() => {
                            let cleanId = decodedText;
                            try {
                                if (decodedText.includes('?')) {
                                    const urlObj = new URL(decodedText);
                                    cleanId = urlObj.searchParams.get('id') || urlObj.searchParams.get('code') || decodedText;
                                }
                            } catch (e) {}
                            verifierID(cleanId.trim());
                        });
                    }
                ).catch(err => {
                    console.error("Erreur caméra : " + err);
                });
            }
        };
    </script>
</body>
</html>
