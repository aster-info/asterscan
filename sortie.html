<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            max-width: 130px;
            height: auto;
            margin-bottom: 15px;
        }
        h3 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
        }
        .status-box {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-label {
            color: #4b5563;
            font-weight: 500;
        }
        .status-value {
            color: #1f2937;
            font-weight: 600;
        }
        .loading-text {
            color: #6b7280;
            font-weight: 500;
            text-align: center;
            padding: 10px;
        }
        #member-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #10b981;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            margin-top: 5px;
            margin-right: 5px;
        }
        .btn-blue {
            background-color: #007bff;
        }
        .btn-blue:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.png" alt="Logo ASTER" class="logo">
        <h3 id="page-title">Contrôle des Sorties</h3>

        <!-- Étape 1 : Le Scanner Caméra -->
        <div id="scanner-container">
            <div id="reader"></div>
            <p style="font-size: 14px; color: #666;">Scannez le badge du membre pour valider la sortie</p>
        </div>

        <!-- Étape 2 : Le Grand Bloc de Résultat -->
        <div id="result-container" style="display: none;">
            <img id="member-photo" src="" alt="Photo du membre">
            
            <!-- Nom et ID avec intégration du Titre -->
            <div id="member-name" style="font-size: 20px; font-weight: bold; color: #1f2937; margin-bottom: 2px;"></div>
            <div id="member-id" style="font-size: 13px; color: #6b7280; font-weight: 500;"></div>
            <div id="member-titre" style="font-size: 13px; color: #4b5563; font-style: italic; margin-bottom: 15px;"></div>

            <!-- Boîte de détails style modale -->
            <div id="message-box" class="status-box"></div>
            <div id="action-area"></div>
        </div>
    </div>

    <script>
        let html5QrCode;
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwUweBhU2D-B9nFFOYF5hWe0m48oCHhGZXVK1-sqyYllMLdwGnrDzjAXi9hbY0mWotq/exec";
        
        const urlParamsGlobal = new URLSearchParams(window.location.search);
        let actionParam = urlParamsGlobal.get('action');

        if (window.location.pathname.includes('sortie') || !actionParam) {
            actionParam = 'sortie';
        }

        function verifierID(memberId) {
            document.getElementById('scanner-container').style.display = 'none';
            const resultContainer = document.getElementById('result-container');
            resultContainer.style.display = 'block';
            
            const imgElem = document.getElementById('member-photo');
            imgElem.style.display = 'none';

            document.getElementById('member-name').innerText = "Vérification...";
            document.getElementById('member-id').innerText = "ID : " + memberId;
            document.getElementById('member-titre').innerText = "";

            const msgBox = document.getElementById('message-box');
            msgBox.className = "status-box loading-text";
            msgBox.innerHTML = "Vérification en cours avec le serveur...";

            fetch(`${scriptUrl}?code=${encodeURIComponent(memberId)}&action=${actionParam}`)
                .then(response => response.json())
                .then(data => {
                    const actionArea = document.getElementById('action-area');
                    actionArea.innerHTML = '';

                    // Affichage de la photo si disponible
                    if (data.photo && data.photo.trim() !== "") {
                        imgElem.src = data.photo;
                        imgElem.style.display = 'inline-block';
                    } else {
                        imgElem.style.display = 'none';
                    }

                    // Injection du Nom, de l'ID et du Titre aux bons endroits
                    document.getElementById('member-name').innerText = data.name || data.nom || "Inconnu";
                    document.getElementById('member-id').innerText = "ID : " + memberId;
                    document.getElementById('member-titre').innerText = data.titre || "";

                    msgBox.className = "status-box";

                    if (data.status === "ok" || data.status === "success") {
                        msgBox.innerHTML = `
                            <div class="status-row"><span class="status-label">✉️ Email :</span> <span class="status-value">${data.email || "Non renseigné"}</span></div>
                            <div class="status-row"><span class="status-label">📥 Arrivée :</span> <span class="status-value">${data.arrivee || "--:--"}</span></div>
                            <div class="status-row"><span class="status-label">📤 Départ :</span> <span class="status-value">${data.depart || "--:--"}</span></div>
                            <div class="status-row"><span class="status-label">📌 Statut :</span> <span class="status-value" style="color: #10b981;">Sortie Validée</span></div>
                        `;
                        
                        const btn = document.createElement('button');
                        btn.className = "btn btn-blue";
                        btn.innerText = "Scanner un autre";
                        btn.onclick = () => location.href = "sortie.html";
                        actionArea.appendChild(btn);

                    } else if (data.status === "enquete_requise") {
                        msgBox.innerHTML = `
                            <div style="color: #d97706; font-weight: bold; margin-bottom: 10px;">⚠️ Enquête de satisfaction requise avant la sortie.</div>
                            <div class="status-row"><span class="status-label">✉️ Email :</span> <span class="status-value">${data.email || "Non renseigné"}</span></div>
                            <div class="status-row"><span class="status-label">📥 Arrivée :</span> <span class="status-value">${data.arrivee || "--:--"}</span></div>
                            <div class="status-row"><span class="status-label">📤 Départ :</span> <span class="status-value">Bloqué</span></div>
                        `;

                        if (data.redirectUrl) {
                            const btnEnquete = document.createElement('a');
                            btnEnquete.className = "btn btn-blue";
                            btnEnquete.innerText = "Remplir l'enquête";
                            btnEnquete.href = data.redirectUrl;
                            btnEnquete.target = "_blank";
                            actionArea.appendChild(btnEnquete);
                        }

                        const btnScan = document.createElement('button');
                        btnScan.className = "btn btn-blue";
                        btnScan.style.backgroundColor = "#6c757d"; 
                        btnScan.innerText = "Scanner un autre";
                        btnScan.onclick = () => location.href = "sortie.html";
                        actionArea.appendChild(btnScan);

                    } else {
                        // Cas d'erreur ou déjà sorti / non présent
                        msgBox.innerHTML = `
                            <div style="color: #ef4444; font-weight: bold; margin-bottom: 10px;">⚠️ ${data.message || "Erreur lors du contrôle."}</div>
                            <div class="status-row"><span class="status-label">✉️ Email :</span> <span class="status-value">${data.email || "Non renseigné"}</span></div>
                            <div class="status-row"><span class="status-label">📥 Arrivée :</span> <span class="status-value">${data.arrivee || "--:--"}</span></div>
                            <div class="status-row"><span class="status-label">📤 Départ :</span> <span class="status-value">${data.depart || "--:--"}</span></div>
                        `;
                        
                        const btn = document.createElement('button');
                        btn.className = "btn btn-blue";
                        btn.innerText = "Scanner un autre";
                        btn.onclick = () => location.href = "sortie.html";
                        actionArea.appendChild(btn);
                    }
                })
                .catch(error => {
                    msgBox.className = "status-box";
                    msgBox.innerHTML = "<div style='color: #ef4444; text-align: center;'>❌ Erreur de connexion au serveur.</div>";
                    const btn = document.createElement('button');
                    btn.className = "btn btn-blue";
                    btn.innerText = "Réessayer";
                    btn.onclick = () => location.href = "sortie.html";
                    actionArea.appendChild(btn);
                    console.error('Erreur:', error);
                });
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id') || urlParams.get('code');

            if (memberId) {
                verifierID(memberId.trim());
            } else {
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    (decodedText) => {
                        html5QrCode.stop().then(() => {
                            let cleanId = decodedText;
                            try {
                                if (decodedText.includes('?')) {
                                    const urlObj = new URL(decodedText);
                                    cleanId = urlObj.searchParams.get('id') || urlObj.searchParams.get('code') || decodedText;
                                }
                            } catch (e) {}
                            verifierID(cleanId.trim());
                        });
                    }
                ).catch(err => {
                    console.error("Erreur caméra : " + err);
                });
            }
        };
    </script>
</body>
</html>
