  <title>Monitoring Entrées & Liste des Inscrits - ASTER</title>
  
  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }

    .logo-container {
      margin: 10px auto 15px auto;
      max-width: 180px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #333;
      margin: 10px 0 15px 0;
      font-size: 1.4em;
    }

    .section-title {
      max-width: 420px;
      margin: 0 auto 10px auto;
      font-size: 1.1em;
      color: #444;
      text-align: center;
      font-weight: bold;
    }

    .history-container, .members-container-card {
      text-align: left;
      max-width: 420px;
      width: 100%;
      margin: 0 auto 20px auto;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .history-item, .member-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .member-item {
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .member-item:hover {
      background-color: #f8f9fa;
    }

    .history-item:last-child, .member-item:last-child {
      border-bottom: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-thumb {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ddd;
      background-color: #eee;
      flex-shrink: 0;
    }

    .badge-count {
      background-color: #00b894;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
      margin-left: 6px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9em;
      margin-bottom: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: #00b894;
    }

    .members-scroll-list {
      max-height: 280px;
      overflow-y: auto;
    }

    .empty-msg {
      color: #aaa;
      text-align: center;
      margin: 10px 0;
      font-size: 0.9em;
    }
